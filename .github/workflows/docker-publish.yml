#
name: Create and publish a Docker image

# Configures this workflow to run every time a change is pushed to the branch called `release`.
on:
  push:
    branches: ['main']

# Defines two custom environment variables for the workflow. These are used for the Container registry domain, and a name for the Docker image that this workflow builds.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# There is a single job in this workflow. It's configured to run on the latest available version of Ubuntu.
jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      # 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # Uses the `docker/login-action` action to log in to the Container registry registry using the account and password that will publish the packages. Once published, the packages are scoped to the account defined here.
      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # This step uses [docker/metadata-action](https://github.com/docker/metadata-action#about) to extract tags and labels that will be applied to the specified image. The `id` "meta" allows the output of this step to be referenced in a subsequent step. The `images` value provides the base name for the tags and labels.
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # set latest tag for default branch
            type=raw,value=latest,enable={{is_default_branch}}            
      # Build the image locally first, so the package check below runs before anything is pushed or signed.
      - name: Build image for the package check
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          push: false
          load: true
          tags: tpn-import-check:ci

      # Every R package the shipped scripts declare (library(), require(), requireNamespace() or pkg::) must load
      # inside the container. The helper scripts the code sources from GitHub (src.url) are scanned as well; test
      # scripts (test_*.r) are skipped because testthat and withr are only needed on CI. If the Dockerfile sets an
      # ENTRYPOINT that does not pass its arguments through, add "--entrypoint Rscript" and drop the word Rscript.
      - name: Check that all imported R packages load in the container
        run: |
          mkdir -p "$RUNNER_TEMP/import-check"
          cat > "$RUNNER_TEMP/import-check/check.r" <<'EOF'
          files <- list.files(".", pattern = "[.][Rr]$", recursive = TRUE, full.names = TRUE)
          files <- files[!grepl("^test_", basename(files))]
          code <- unlist(lapply(files, readLines, warn = FALSE))
          # helper scripts sourced at run time, e.g. source(paste0(src.url, "eta.r"))
          url_lines <- grep('src\\.url\\s*(=|<-)\\s*"', code, value = TRUE)
          base_url <- unique(sub('.*src\\.url\\s*(=|<-)\\s*"([^"]+)".*', "\\2", url_lines))
          helpers <- unique(sub('.*"([^"]+)"\\)$', "\\1",
                                unlist(regmatches(code, gregexpr('paste0\\(src\\.url,\\s*"[^"]+"\\)', code)))))
          for (u in base_url) for (h in helpers) code <- c(code, readLines(paste0(u, h), warn = FALSE))
          code <- sub("#.*$", "", code)
          decl <- unlist(regmatches(code, gregexpr("(library|require|requireNamespace)\\(\\s*['\"]?[A-Za-z][A-Za-z0-9.]*", code)))
          pkgs <- sub(".*\\(\\s*['\"]?", "", decl)
          pkgs <- c(pkgs, unlist(regmatches(code, gregexpr("[A-Za-z][A-Za-z0-9.]*(?=:::?)", code, perl = TRUE))))
          pkgs <- sort(unique(pkgs))
          cat(R.version.string, "\nScripts:", basename(files), "\nHelpers:", helpers,
              "\nDeclared packages:", if (length(pkgs)) pkgs else "none", "\n")
          ok <- vapply(pkgs, function(p) suppressWarnings(suppressPackageStartupMessages(
                         require(p, character.only = TRUE, quietly = TRUE))), logical(1))
          if (!all(ok)) {
            cat("Cannot load in the container:", pkgs[!ok], "\n")
            quit(save = "no", status = 1)
          }
          cat("All declared packages load.\n")
          EOF
          docker run --rm -w /src -v "$RUNNER_TEMP/import-check:/import-check:ro" tpn-import-check:ci \
            Rscript /import-check/check.r

      # This step uses the `docker/build-push-action` action to build the image, based on your repository's `Dockerfile`. If the build succeeds, it pushes the image to GitHub Packages.
      # It uses the `context` parameter to define the build's context as the set of files located in the specified path. For more information, see "[Usage](https://github.com/docker/build-push-action#usage)" in the README of the `docker/build-push-action` repository.
      # It uses the `tags` and `labels` parameters to tag and label the image with the output from the "meta" step.
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Source cosign to sign image
        uses: sigstore/cosign-installer@v3

      - name: Sign the published Docker image
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PASSWORD: ""
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "${{ secrets.SIGNING_SECRET }}" > ./cosign.key
          echo "${TAGS}" | xargs -I {} cosign sign --yes --key ./cosign.key {}@${DIGEST}
      
      # This step generates an artifact attestation for the image, which is an unforgeable statement about where and how it was built. It increases supply chain security for people who consume the image. For more information, see "[AUTOTITLE](/actions/security-guides/using-artifact-attestations-to-establish-provenance-for-builds)." 
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

