# Runs the testthat suite in tests/testthat/ against func.r and simulate.r
# on every push/PR. See tests/testthat/helper-fixtures.R for how the two
# scripts are located and sandboxed (they use hard-coded relative paths
# that only resolve from their own directory).
#
# Built on r-lib/actions (https://github.com/r-lib/actions/tree/v2), the
# actively-maintained GitHub Actions toolkit for R projects.

name: R CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install testthat
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # No DESCRIPTION file exists (this isn't an R package), so this
          # overrides setup-r-dependencies' default `deps::., any::sessioninfo`
          # (which expects one) with just what the test suite itself needs.
          packages: any::testthat

      - name: Run testthat suite
        run: Rscript tests/testthat.R
